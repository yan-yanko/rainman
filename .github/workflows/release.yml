name: Release

# Build, generate an SBOM, sign with Sigstore (keyless/OIDC), and attach
# everything to the GitHub Release. Triggered by pushing a version tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release + upload assets
  id-token: write   # OIDC token for keyless Sigstore signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          # Rainman has zero runtime deps; the SBOM documents exactly that.
          cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore*
            sbom.cdx.json
          generate_release_notes: true
