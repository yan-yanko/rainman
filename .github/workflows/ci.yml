name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest ruff
      - run: ruff check rainman/
      - run: pytest tests/ -m unit -v

  # Guard against the committed docs/ (GitHub Pages output, also linked from
  # the README) drifting from the landing/ source. A fresh build must produce
  # exactly what's committed.
  landing-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        working-directory: landing
        run: npm ci
      - name: Build (landing/ -> docs/)
        working-directory: landing
        run: npm run build
      - name: Fail if docs/ is out of sync with landing/
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date. Run 'cd landing && npm run build' and commit the result."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
          echo "docs/ is in sync with landing/ source."
