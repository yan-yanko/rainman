[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainman-server"
version = "0.1.0"
description = "Self-hosted sync server for Rainman team memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yan Yanko"}]
keywords = ["memory", "sync", "self-hosted", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# The client (rainman/) is stdlib-only; the server may take deps.
# PyJWT[crypto] powers OIDC SSO; cryptography also backs encryption-at-rest.
dependencies = ["PyJWT[crypto]>=2.8"]

[project.scripts]
rainman-server = "rainman_server.__main__:main"

[tool.setuptools.packages.find]
include = ["rainman_server*"]
