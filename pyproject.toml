[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Distribution name is `rainman-memory` (bare `rainman` on PyPI is squatted by
# a dead 2011 BitTorrent package — PEP 541 reclamation filed separately). The
# import package and the CLI remain `rainman`:
#   pip install rainman-memory  ->  import rainman  /  $ rainman
[project]
name = "rainman-memory"
version = "0.1.1"
description = "Project memory for AI coding agents — remembers every failure, fix and decision your agent makes, and recalls the right one when the same problem returns. Zero LLM calls, zero dependencies, runs local."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yan Yanko"}]
keywords = ["memory", "ai-memory", "claude-code", "mcp", "coding-agent",
            "developer-tools", "context", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/yan-yanko/rainman"
Repository = "https://github.com/yan-yanko/rainman"
Issues = "https://github.com/yan-yanko/rainman/issues"

[project.optional-dependencies]
# Optional local semantic-retrieval lane (M7). The CORE has ZERO runtime
# dependencies; this extra adds a small, CPU-only, fully-local static embedding
# model (model2vec / potion-base-8M, ~8MB, numpy-only — no torch, no network).
# Installing it activates the dense lane when policy `semantic_search` is on.
semantic = ["model2vec>=0.3.0"]

[project.scripts]
rainman = "rainman.__main__:main"

[tool.setuptools.packages.find]
include = ["rainman*"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no external deps, <0.1s)",
    "integration: integration tests",
]
testpaths = ["tests"]
