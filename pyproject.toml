[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainman"
version = "0.1.0"
description = "Context-aware project memory for AI coding tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yan Yanko"}]
keywords = ["memory", "developer-tools", "mcp", "ai", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# Optional local semantic-retrieval lane (M7). The CORE has ZERO runtime
# dependencies; this extra adds a small, CPU-only, fully-local static embedding
# model (model2vec / potion-base-8M, ~8MB, numpy-only — no torch, no network).
# Installing it activates the dense lane when policy `semantic_search` is on.
semantic = ["model2vec>=0.3.0"]

[project.scripts]
rainman = "rainman.__main__:main"

[tool.setuptools.packages.find]
include = ["rainman*"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no external deps, <0.1s)",
    "integration: integration tests",
]
testpaths = ["tests"]
